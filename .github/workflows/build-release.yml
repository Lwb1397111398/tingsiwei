name: build-release

# 应用自更新：每次推 main 自动构建 Release APK 并发布到 latest Release，
# 手机端「检查更新」即可发现并下载安装，无需连电脑。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode = git 提交数，必须拿全量历史（shallow clone 会数错）
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 签名钥匙不进 git 仓库：从 Actions Secrets 还原成本机同名文件，
      # 保证 CI 包与本机 release 包签名指纹一致，覆盖安装不需要卸载
      - name: 还原签名钥匙
        env:
          KEYSTORE_B64: ${{ secrets.TSW_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.TSW_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TSW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TSW_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "缺少 Actions Secret: TSW_KEYSTORE_B64"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > tingsiwei-release.jks
          printf 'storeFile=tingsiwei-release.jks\nkeyAlias=%s\nstorePassword=%s\nkeyPassword=%s\n' \
            "$KEY_ALIAS" "$STORE_PASSWORD" "$KEY_PASSWORD" > keystore.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: 构建 Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 发布到 latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(git rev-list --count HEAD)
          NAME="1.5.$CODE"
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" Tingsiwei-latest.apk

          # 第一行 HTML 注释是机器可读元数据（App 解析 versionCode 判断有无新版本），
          # GitHub 页面渲染时不可见
          {
            echo "<!-- tingsiwei-update versionCode=$CODE versionName=$NAME -->"
            echo "自动构建 · 提交 ${GITHUB_SHA::7}"
            echo
            echo "更新内容："
            git log --pretty=format:'- %s' -5
          } > notes.md

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Tingsiwei-latest.apk --clobber
            gh release edit latest --title "听的思维 $NAME" --notes-file notes.md
          else
            gh release create latest Tingsiwei-latest.apk \
              --title "听的思维 $NAME" --notes-file notes.md
          fi
          echo "已发布：versionCode=$CODE versionName=$NAME"
